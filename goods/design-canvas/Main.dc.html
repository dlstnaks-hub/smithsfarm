<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>브랜드 키트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Nanum+Myeongjo:wght@700;800&amp;family=IBM+Plex+Sans+KR:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f6b3a}a:hover{color:#1f4a27}
</style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 64px; background: #f6f3ec; color: #1f2a1f; font-family: 'IBM Plex Sans KR', sans-serif; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px">
<div style="display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 13px; letter-spacing: 0.2em; font-weight: 600; color: {{accent}}">HAEUNDAE · BUSAN · ITALIAN KITCHEN</div>
<div style="font-family: 'DM Serif Display', serif; font-size: 96px; line-height: 0.95; color: {{accent}}">Smith's<br>Farm</div>
<div style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 36px">스미스씨네 농장</div>
</div>
<div style="display: flex; gap: 20px; align-items: center; padding: 20px; border: 2px solid {{accent}}; border-radius: 20px">
<div style="width: 112px; height: 112px; flex-shrink: 0; border-radius: 56px; background: #c4532d; color: #f6f3ec; display: flex; align-items: center; justify-content: center">
<svg width="84" height="84" viewBox="0 0 120 120" fill="none" aria-hidden="true">
<ellipse cx="60" cy="48" rx="34" ry="32" fill="currentColor"></ellipse>
<path d="M34 70 C28 92 18 98 12 92 M48 76 C46 98 38 110 30 106 M72 76 C74 98 82 110 90 106 M86 70 C92 92 102 98 108 92" stroke="currentColor" stroke-width="10" stroke-linecap="round"></path>
<circle cx="48" cy="48" r="6" fill="#c4532d"></circle>
<circle cx="72" cy="48" r="6" fill="#c4532d"></circle>
<path d="M52 62 Q60 68 68 62" stroke="#c4532d" stroke-width="4" stroke-linecap="round"></path>
</svg>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #c4532d">MASCOT</div>
<div style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 28px">문어 “씨!”</div>
<div style="font-size: 15px; line-height: 1.5; color: #4a554a">시그니처 sea! 돌문어 스테이크에서 따온 캐릭터. 스티커·에코백·키즈 굿즈에 공통으로 씁니다.</div>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em">COLORS</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="height: 96px; border-radius: 16px; background: {{accent}}; color: #f6f3ec; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-size: 14px"><b>농장 그린</b><span>#2F6B3A</span></div>
<div style="height: 96px; border-radius: 16px; background: #c4532d; color: #ffffff; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-size: 14px"><b>문어 테라코타</b><span>#C4532D</span></div>
<div style="height: 96px; border-radius: 16px; background: #e9a93b; color: #1f2a1f; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-size: 14px"><b>단호박 옐로</b><span>#E9A93B</span></div>
<div style="height: 96px; border-radius: 16px; background: #f6f3ec; border: 1px solid #c9c2b2; color: #1f2a1f; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-size: 14px"><b>밀가루 화이트</b><span>#F6F3EC</span></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em">TYPE</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px; background: #ffffff; border-radius: 16px">
<div style="font-family: 'DM Serif Display', serif; font-size: 34px; color: {{accent}}">Gnocchi &amp; Octopus</div>
<div style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 26px">수제 뇨끼와 돌문어</div>
<div style="font-size: 15px; color: #4a554a">본문 · IBM Plex Sans KR — 영문 로고는 DM Serif Display, 한글 제목은 나눔명조</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2f6b3a","options":["#2f6b3a","#1f4a27","#c4532d","#3b5b8c"]},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2f6b3a' };
}
}
</script>
</body>
</html>
