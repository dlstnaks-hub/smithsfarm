<h1>스미스팜 빌지 꽂이 · 시안 3종</h1><div class="sub">모양(도무송 칼선)은 원본 그대로 · 색과 표현만 변경</div>
<div class="row">
<div class="card"><img src="art_3d.png"><br><span class="tag">A · 입체적</span><p>말랑한 스티커처럼 볼록하게. 채소마다 하이라이트와 그림자가 생기고, 앞 채소가 뒤 채소에 그림자를 드리워 겹겹이 쌓인 느낌.</p></div>
<div class="card"><img src="art_abs.png"><br><span class="tag">B · 추상적</span><p>그래픽 포스터 느낌. 브랜드 주황·초록·보라 색 블록에 줄무늬·도트·원 패턴, 판화처럼 어긋난 그림자.</p></div>
<div class="card"><img src="art_real.png"><br><span class="tag">C · 현실적</span><p>진짜 채소처럼. 토마토·가지의 윤기, 당근 주름, 잎맥과 줄기 결, 자연스러운 그라데이션과 질감.</p></div>
